<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Autor</title>
    <link rel="stylesheet" href="autor.css">
</head>

<body onload="listar()">
    <header>
        <h1>Cadastro de Autores</h1>
        <p>Gerencie os autores do sistema.</p>
    </header>

    <main class="container-master">
        <div class="conteudo-principal">
            <section class="form-esquerda">
                <h2>Dados do Autor</h2>
                
                <label for="inputId_autor">ID do autor</label>
                <div class="linha-id">
                    <input type="number" name="inputId_autor" id="inputId_autor" placeholder="Ex: 1" min="1">
                    <input type="button" value="Procure" id="btProcure" onclick="procure()">
                    <input type="button" value="Inserir" id="btInserir" onclick="inserir()" style="display:none;">
                    <input type="button" value="Alterar" id="btAlterar" onclick="alterar()" style="display:none;">
                    <input type="button" value="Excluir" id="btExcluir" onclick="excluir()" style="display:none;">
                </div>

                <label for="inputNome_autor">Nome do autor</label>
                <input type="text" name="inputNome_autor" id="inputNome_autor" placeholder="Ex: Colleen Hoover">

                <div id="divAviso">Informe o ID do autor e clique em Procure</div>

                <div class="botoes-acao">
                    <input type="button" value="Salvar" id="btSalvar" onclick="salvar()" style="display:none;">
                    <input type="button" value="Cancelar" id="btCancelar" onclick="cancelarOperacao()" style="display:none;">
                </div>
            </section>
        </div>

        <section class="lista-autor">
            <h3>Autores Cadastrados</h3>
            <div id="outputSaida">Carregando...</div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Sistema CRUD Autores. Todos os direitos reservados.</p>
    </footer>

    <script src="./autor.js"></script>
</body>

</html>
